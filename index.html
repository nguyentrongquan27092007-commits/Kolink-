function mine(){return S.role=='koc'?S.cons.filter(c=>c.ke==S.me):S.cons}function vCon(){return mine().length?mine().map(card).join(''):'<div class="c m">'+(S.role=='koc'?'You have no contracts yet. Open the Campaigns tab and apply to a campaign to get started.':S.role=='admin'?'No contracts or disputes yet.':'No contracts yet. When a KOC applies to your campaign, the contract will appear here.')+'</div>'}

function vScore(){const s=score(),r=[...S.oth,[U().n+' (you)',s]].filter(x=>x[1]!==null).sort((a,b)=>b[1]-a[1]);

function vTax(){const inc=S.cons.filter(c=>c.ke==S.me).reduce((a,c)=>a+c.paid,0),p=inc/S.lim*100,w=p>=100?['wn','Over the threshold. Check your tax filing obligations with an accountant.']:p>=90?['wn','Close to the threshold (90% or more).']:p>=70?['wn','70% or more of the threshold used.']:['ok','Below the warning threshold.'];
