return `<div class="c"><span class="m">Thu nhập qua KOLink (ròng)</span><div class="big">${f(inc)}</div><div class="bar"><i style="width:${Math.min(100,p)}%"></i></div><span class="t ${w[0]}">${w[1]}</span><p class="m">Ngưỡng cảnh báo/năm (chỉnh được, xác nhận với kế toán):</p><input type="number" value="${S.lim}" onchange="S.lim=Math.max(1,+this.value);R()" style="max-width:220px"></div><div class="c tb"><table><tr><th>Hợp đồng</th><th>Thu nhập ròng</th></tr>${S.cons.filter(c=>c.paid&&c.ke==S.me).map(c=>`<tr><td>${esc(c.t)}</td><td>${f(c.paid)}</td></tr>`).join('')||'<tr><td colspan=2 class="m">Chưa có khoản thu</td></tr>'}</table></div>`}
function R(){save();document.body.dataset.v=S.me?'app':(S.go?'auth':'land');if(!S.me){$('role').innerHTML='';$('nav').innerHTML='';$('v').innerHTML=S.go?vAuth():vLand();return}$('role').innerHTML=`<span class='m' style='padding:0 8px;align-self:center'>${esc(U().n)} · ${{seller:'Seller',koc:'KOC',admin:'Admin'}[S.role]}</span><button onclick='A.out()'>Đăng xuất</button>`;
